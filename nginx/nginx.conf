worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Rate limiting — previene abuso en endpoints públicos
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=200r/s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream fastapi_backend {
        server fastapi:8000;
    }

    upstream astro_frontend {
        server astro:4321;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check FastAPI (sin rate limit para monitoreo)
        location /api/health {
            proxy_pass http://fastapi_backend/health;
            proxy_set_header Host $host;
        }

        # API FastAPI — pasa el path completo incluyendo /api/
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Frontend Astro — todo lo demás
        location / {
            limit_req zone=general_limit burst=100 nodelay;

            proxy_pass http://astro_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}
