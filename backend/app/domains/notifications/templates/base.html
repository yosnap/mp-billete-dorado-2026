<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{% block title %}MP Billete Dorado 2026{% endblock %}</title>
  <style>
    /* Reset básico para clientes de email */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, Helvetica, sans-serif; }

    /* Contenedor principal — máx 600px */
    .wrapper { width: 100%; background-color: #f4f4f4; padding: 20px 0; }
    .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; }

    /* Cabecera dorada */
    .header { background-color: #b8960c; padding: 32px 24px; text-align: center; }
    .header h1 { color: #ffffff; font-size: 24px; margin: 0; font-weight: bold; letter-spacing: 1px; }
    .header p  { color: #ffe98a; font-size: 13px; margin: 6px 0 0; }

    /* Cuerpo */
    .body { padding: 32px 24px; color: #333333; font-size: 15px; line-height: 1.6; }
    .body h2 { color: #b8960c; font-size: 20px; margin-top: 0; }
    .body p { margin: 0 0 16px; }

    /* Botón CTA */
    .btn-wrapper { text-align: center; margin: 24px 0; }
    .btn { display: inline-block; background-color: #b8960c; color: #ffffff !important;
           text-decoration: none; padding: 14px 32px; border-radius: 4px;
           font-size: 16px; font-weight: bold; }

    /* Pie de página */
    .footer { background-color: #f9f9f9; border-top: 1px solid #eeeeee;
              padding: 16px 24px; text-align: center; color: #888888; font-size: 12px; line-height: 1.5; }
    .footer a { color: #b8960c; text-decoration: none; }

    /* Responsive */
    @media only screen and (max-width: 620px) {
      .container { width: 100% !important; border-radius: 0 !important; }
      .body { padding: 24px 16px !important; }
      .header { padding: 24px 16px !important; }
      .btn { display: block !important; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <table class="container" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td class="header">
        <h1>MP Billete Dorado 2026</h1>
        <p>{% block header_subtitle %}La gran campaña promocional de MainPaper{% endblock %}</p>
      </td>
    </tr>
    <tr>
      <td class="body">
        {% block content %}{% endblock %}
      </td>
    </tr>
    <tr>
      <td class="footer">
        <p>© 2026 MainPaper · Todos los derechos reservados</p>
        <p>MainPaper S.A. · Calle Ficticia 123, Bogotá, Colombia</p>
        {% block footer_extra %}{% endblock %}
      </td>
    </tr>
  </table>
</div>
</body>
</html>
